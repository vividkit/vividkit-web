<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
  <title id="title">ClaudeKit hooks as guard rails</title>
  <desc id="desc">Diagram showing a user request flowing through Claude Code lifecycle events, ClaudeKit hook guard rails, and resulting actions such as allow, block, inject context, or save state.</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
    .title { fill:#f8fafc; font-size:24px; font-weight:700; }
    .subtitle { fill:#cbd5e1; font-size:14px; }
    .node-title { fill:#f8fafc; font-size:15px; font-weight:700; }
    .node-sub { fill:#cbd5e1; font-size:12px; }
    .label { fill:#e2e8f0; font-size:12px; font-weight:600; }
    .tiny { fill:#94a3b8; font-size:11px; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#f87171"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#4ade80"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#c084fc"/></marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="960" height="600" rx="18" fill="#020617"/>
  <rect x="22" y="22" width="916" height="556" rx="18" fill="#0f172a" stroke="#334155"/>
  <text x="48" y="62" class="title">ClaudeKit hooks are guard rails around Claude Code</text>
  <text x="48" y="88" class="subtitle">They listen to lifecycle events, inspect JSON context, then allow, block, guide, or remember.</text>

  <g filter="url(#soft-shadow)">
    <rect x="56" y="150" width="150" height="92" rx="12" fill="#111827" stroke="#475569" stroke-width="1.5"/>
    <circle cx="88" cy="184" r="17" fill="#1e3a8a" stroke="#3b82f6"/>
    <path d="M82 184h12M88 178v12" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>
    <text x="112" y="181" class="node-title">User intent</text>
    <text x="112" y="204" class="node-sub">prompt or tool</text>
    <text x="112" y="220" class="node-sub">request</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="286" y="136" width="190" height="120" rx="12" fill="#111827" stroke="#475569" stroke-width="1.5"/>
    <rect x="306" y="158" width="48" height="38" rx="8" fill="#1e3a8a" stroke="#3b82f6"/>
    <path d="M317 177h22M317 186h15" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round"/>
    <text x="368" y="172" class="node-title">Claude Code</text>
    <text x="368" y="195" class="node-sub">lifecycle event</text>
    <text x="306" y="224" class="tiny">SessionStart / PreToolUse /</text>
    <text x="306" y="241" class="tiny">PostToolUse / Stop</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="570" y="118" width="244" height="154" rx="14" fill="#0b1120" stroke="#60a5fa" stroke-width="2"/>
    <path d="M618 145l22 9v19c0 16-9 28-22 34-13-6-22-18-22-34v-19l22-9z" fill="#1e3a8a" stroke="#93c5fd" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M609 177l8 8 20-23" fill="none" stroke="#93c5fd" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="662" y="156" class="node-title">ClaudeKit hooks</text>
    <text x="662" y="178" class="node-sub">guard rails layer</text>
    <text x="594" y="224" class="tiny">Reads JSON context via stdin</text>
    <text x="594" y="244" class="tiny">Checks rules, settings, privacy, state</text>
    <text x="594" y="264" class="tiny">Returns guidance or an exit decision</text>
  </g>

  <g>
    <path d="M206 196 H286" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
    <rect x="224" y="178" width="54" height="20" rx="4" fill="#0f172a" opacity="0.96"/>
    <text x="231" y="192" class="label">request</text>
    <path d="M476 196 H570" stroke="#fb923c" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
    <rect x="497" y="178" width="50" height="20" rx="4" fill="#0f172a" opacity="0.96"/>
    <text x="505" y="192" class="label">event</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="156" y="372" width="162" height="78" rx="12" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
    <text x="182" y="402" class="node-title">Allow</text>
    <text x="182" y="423" class="node-sub">continue safely</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="346" y="372" width="162" height="78" rx="12" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="372" y="402" class="node-title">Block</text>
    <text x="372" y="423" class="node-sub">stop risky action</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="536" y="372" width="162" height="78" rx="12" fill="#2e1065" stroke="#a855f7" stroke-width="1.5"/>
    <text x="562" y="402" class="node-title">Inject</text>
    <text x="562" y="423" class="node-sub">add useful context</text>
  </g>
  <g filter="url(#soft-shadow)">
    <rect x="726" y="372" width="162" height="78" rx="12" fill="#431407" stroke="#f97316" stroke-width="1.5"/>
    <text x="752" y="402" class="node-title">Remember</text>
    <text x="752" y="423" class="node-sub">save session state</text>
  </g>

  <g>
    <path d="M650 272 C590 322 335 322 255 372" stroke="#4ade80" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
    <rect x="414" y="304" width="78" height="20" rx="4" fill="#0f172a" opacity="0.96"/>
    <text x="422" y="318" class="label">safe path</text>
    <path d="M682 272 C650 325 480 325 444 372" stroke="#f87171" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
    <rect x="544" y="309" width="88" height="20" rx="4" fill="#0f172a" opacity="0.96"/>
    <text x="552" y="323" class="label">guardrail</text>
    <path d="M716 272 C720 326 640 326 626 372" stroke="#c084fc" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
    <rect x="668" y="314" width="72" height="20" rx="4" fill="#0f172a" opacity="0.96"/>
    <text x="676" y="328" class="label">guidance</text>
    <path d="M748 272 C805 318 814 328 814 372" stroke="#fb923c" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
    <rect x="795" y="314" width="54" height="20" rx="4" fill="#0f172a" opacity="0.96"/>
    <text x="803" y="328" class="label">state</text>
  </g>

  <g transform="translate(56, 520)">
    <line x1="0" y1="8" x2="34" y2="8" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="44" y="12" class="tiny">request / event flow</text>
    <line x1="178" y1="8" x2="212" y2="8" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="222" y="12" class="tiny">block path</text>
    <line x1="334" y1="8" x2="368" y2="8" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <text x="378" y="12" class="tiny">context guidance</text>
  </g>
</svg>
