name: AgentKit exact toolchain

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentkit-exact-toolchain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 22.21.1 / npm 10.9.4
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Pin npm
        run: npm install --global npm@10.9.4

      - name: Install from lockfile
        run: npm ci

      - name: Verify exact toolchain
        run: npm run verify:exact-toolchain

      - name: Build and run AgentKit gates
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev
